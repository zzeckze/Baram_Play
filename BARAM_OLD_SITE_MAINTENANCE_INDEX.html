<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BARAM PLAY - 운영 사이트 이전 안내</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #1f2937;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #f3f4f6;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.35;
    }
    p {
      margin: 0 auto 26px;
      max-width: 440px;
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
    }
    a.button {
      display: inline-block;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .url {
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">운영 사이트 이전 안내</div>
    <h1>기존 사이트 운영이 종료되었습니다.</h1>
    <p>
      BARAM PLAY가 새 운영 사이트로 이전되었습니다.<br />
      아래 버튼을 눌러 신버전 사이트를 이용해주세요.
    </p>
    <a class="button"
       href="https://baramplay-art.github.io/Baram_Play_New/">
      신버전 BARAM PLAY로 이동
    </a>
    <div class="url">
      https://baramplay-art.github.io/Baram_Play_New/
    </div>
  </main>
</body>
</html>
