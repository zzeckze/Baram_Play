function adminPage(){if(!canManage())return '<div class="card empty">관리자&스탭 또는 보안자만 사용할 수 있습니다.</div>';const registry=adminStaffPeople(),security=session.role==='security';return `<div class="section-title"><h2>관리</h2><button class="btn danger" onclick="logout()">로그아웃</button></div><div class="card"><div class="section-title"><h3>👥 관리자 · 스탭 관리</h3><button class="btn primary smallbtn" onclick="openPersonModal()">+ 관리자/스탭 등록</button></div><div class="registry-note">배우는 작품·캐스팅 → 캐스팅별 보기에서 등록합니다. 배우가 스탭이나 관리자 역할을 겸하는 경우에는 두 화면에 함께 표시됩니다.</div>${registry.length?`<div class="person-grid">${registry.map(p=>`<div class="person-card"><b>${esc(p.name)}</b><div class="roles">${esc(roleText(p))}${p.active===false?' · 활동중지':''}</div><div class="actions tight" style="justify-content:center;margin-top:8px"><button class="btn smallbtn" onclick="openPersonModal('${p.id}')">수정</button></div></div>`).join('')}</div>`:'<div class="empty">등록된 관리자/스탭이 없습니다.</div>'}</div><div class="card"><h3 style="margin-top:0">🪧 사이트 기본 설정</h3><div class="field"><label>단체/사이트 이름</label><input id="orgName" value="${esc(data.orgName)}"></div><div class="field"><label>설명</label><input id="orgSub" value="${esc(data.orgSub)}"></div><div class="field-inline"><div class="field"><label>일반 입장 코드</label><input id="entryCode" value="${esc(data.entryCode)}"></div><div class="field"><label>관리자&스탭 코드</label><input id="adminCode" value="${esc(data.adminCode)}"></div></div>${security?`<div class="field"><label>보안자 코드</label><input id="securityCode" value="${esc(data.securityCode)}"></div>`:''}<button class="btn primary" onclick="saveAdminBasics()">기본 설정 저장</button>${security?'':'<div class="small muted" style="margin-top:8px">보안자 코드는 보안자 모드에서만 확인·수정할 수 있습니다.</div>'}</div><div class="card"><h3 style="margin-top:0">🎨 간단 디자인 설정</h3>${colorSetting('전체 페이지 배경색','thBg',data.theme.bg)}${colorSetting('카드색','thCard',data.theme.card)}${colorSetting('글씨색','thInk',data.theme.ink)}${colorSetting('주요 버튼색','thPrimary',data.theme.prim   let h='<div class="calendar-week">'+['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="calendar-grid work-month-calendar">';
  for(let i=0;i<first.getDay();i++)h+='<div class="cal-day empty"></div>';
  for(let d=1;d<=last.getDate();d++){
    const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=data.events.filter(e=>e.workId===workId&&e.date===date).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    h+=`<div class="cal-day" ${items.length?`role="button" tabindex="0" onclick="openWorkDateDetail('${workId}','${date}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openWorkDateDetail('${workId}','${date}')}"`:''}><div class="cal-num">${d}</div>${items.slice(0,3).map(e=>compactCalendarEventHtml(e,false)).join('')}${items.length>3?`<div class="tiny muted">+${items.length-3}건</div>`:''}</div>`;
  }
  return h+'</div>';
}
function openWorkDateDetail(workId,date){

  if(!items.length)return;
  const bg=modalShell(`<h3>${dateLabel(date)} · ${esc(w.title)}</h3>${items.map(e=>{
    const st=getStaffingInfo(e),ids=assignedActorIds(e),done=ids.filter(pid=>eventConfirmedByPerson(e,pid)).length;

  }).join('')}<div class="modal-sticky"><div class="actions"><button class="btn primary" data-close>닫기</button></div></div>`);

}
function renderWorkCalendarSection(workId){

function calendarPage(){const today=localDateKey(),month=session.calendarMonth,monthEvents=data.events.filter(e=>e.date?.startsWith(month)),unconfirmed=monthEvents.filter(e=>e.status==='inquiry').length,casting=monthEvents.filter(e=>e.status==='confirmed'&&getStaffingInfo(e).state!=='complete').length,upcoming=data.events.filter(e=>e.date&&e.date>=today).sort((a,b)=>(a.date+(a.startTime||'')).localeCompare(b.date+(b.startTime||''))).slice(0,4);return `<div class="section-title"><h2>전체 캘린더</h2><div class="calendar-toolbar">${changeAlertButton()}<button class="btn" type="button" onclick="openCalendarExport()">↓ 내보내기</button></div></div><div class="calendar-filterbar"><button type="button" class="calendar-filter-btn ${calendarFilterOn('unconfirmed')?'on':''}" onclick="toggleCalendarFilter('unconfirmed')">${calendarFilterOn('unconfirmed')?'✓':'○'} 공연 미확정 <span class="count">${unconfirmed}</span></button><button type="button" class="calendar-filter-btn ${calendarFilterOn('casting')?'on':''}" onclick="toggleCalendarFilter('casting')">${calendarFilterOn('casting')?'✓':'○'} 배역 미확정 <span class="count">${casting}</span></button></div><div class="calendar-legend"><span><i class="c1"></i>공연확정</span><span><i class="c2"></i>공연 미확정</span><span><i class="c3"></i>배역 미확정/배우 불가능</span></div><div class="card"><div class="calendar-head"><button class="btn" onclick="moveCalendar(-1)">◀</button><b>${month.replace('-','년 ')}월</b><button class="btn" onclick="moveCalendar(1)">▶</button></div><div class="small muted" style="margin-bottom:9px">공연 자체가 미확정이면 캐스팅 상태와 관계없이 주황색으로 먼저 표시합니다. 공연확정 이후에만 배역 미확정/배우 불가능 여부를 빨간색으로 판단합니다.${calendarFiltersActive()?' 현재 선택한 조건에 맞는 일정만 표시 중입니다.':''}</div>${renderEventCalendar(month)}</div><div class="section-title" style="margin-top:16px"><h3>다가오는 일정</h3><button class="btn smallbtn" onclick="go('events')">전체보기</button></div>${upcoming.length?upcoming.map(eventCard).join(''):'<div class="card empty">등록된 향후 일정이 없습니다.</div>'}`}

function drawEventStaffing(bg,draft){const area=bg.querySelector('#emStaffing'),w=workById(draft.workId);if(!w){area.innerHTML='<div class="empty">작품을 선택하면 배역별 배우와 스탭을 선택할 수 있습니다.</div>';return}const groups=(w.castGroups||[]).filter(g=>g.kind==='actor'&&(w.roleNames||[]).includes(g.label));draft.assignments=draft.assignments||{};draft.staffIds=Array.isArray(draft.staffIds)?draft.staffIds:[];const actorHtml=groups.length?groups.map(g=>{const chosen=(draft.assignments[g.id]||[]).filter(id=>(g.candidateIds||[]).includes(id));return `<div class="staff-group ${chosen.length?'ok':'missing'}"><div class="staff-title"><b>🎭 ${esc(g.label)}</b><span class="badge ${chosen.length?'complete':'incomplete'}">${chosen.length?`선택 ${chosen.length}명`:'미선택'}</span></div>${g.candidateIds.length?g.candidateIds.map(pid=>{const p=personById(pid);if(!p)return '';const fake={...draft,id:draft.id||''},st=draft.date?(getAvailabilityForEvent(pid,fake)?.status||'available'):'available',avClass=st==='unavailable'?'unavailable':st==='pending'?'pending':'available',checked=chosen.includes(pid);return `<label class="assign-candidate"><input type="checkbox" data-group="${g.id}" data-person="${pid}" ${checked?'checked':''}><div class="candidate-main"><b>${esc(p.name)}</b><div class="small muted">${draft.date?esc(availabilitySummary(getAvailabilityForEvent(pid,fake))):'날짜를 선택하면 일정 상태가 표시됩니다.'}</div></div><span class="badge ${avClass}">${draft.date?availabilityLabel(st):'날짜미정'}</span></label>`}).join(''):'<div class="empty">이 배역에 연결된 등록 배우가 없습니다.</div>'}</div>`}).join(''):'<div class="empty">이 작품에는 아직 배역이 등록되지 않았습니다. 작품 수정에서 배역과 배우를 등록해주세요.</div>';const staff=staffPeople();const staffHtml=`<div class="hr-label">스탭</div><div class="staff-picker"><div class="small muted" style="margin-bottom:7px">관리 페이지에서 ‘스탭’으로 등록된 인원입니다. 스탭은 가능/불가능 일정을 확인하지 않습니다.</div>${staff.length?staff.map(p=>`<label class="assign-candidate"><input type="checkbox" data-event-staff="${p.id}" ${draft.staffIds.includes(p.id)?'checked':' function renderPersonalCalendar(personId,month){const base=parseMonth(month),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),selected=new Set(selectedAvailabilityDates(personId)),multi=!!session.availabilityMultiMode,events=personalEvents(personId,month);let h='<div class="calendar-week">'+['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="calendar-grid personal-calendar">';for(let i=0;i<first.getDay();i++)h+='<div class="cal-day empty"></div>';for(let d=1;d<=last.getDate();d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=getAvailability(personId,date),st=a?.status==='unavailable'?'unavailable':a?.status==='pending'?'pending':'available',items=events.filter(e=>e.date===date);h+=`<button type="button" class="cal-day ${multi&&selected.has(date)?'selected':''}" onclick="${multi?`toggleAvailabilityDate('${personId}','${date}','page')`:`openPersonalDateDetail('${personId}','${date}')`}"><div class="cal-num">${d}</div><div class="av-state ${st}">${availabilityLabel(st)}</div>${items.length?`<div class="personal-event-list">${items.slice(0,3).map(e=>{const c=personalEventCategory(personId,e);return `<div class="personal-event-pill ${c.key}">${c.icon} ${esc(eventNickname(e))}</div>`}).join('')}${items.length>3?`<div class="tiny muted">+${items.length-3}공연</div>`:''}</div>`:''}</button>`}return h+'</div>'}
function renderPersonalList(personId,month){const events=personalEvents(personId,month),dates=new Set(events.map(e=>e.date));Object.keys(data.availability?.[personId]||{}).filter(d=>d.startsWith(month)).forEach(d=>dates.add(d));const arr=[...dates].sort();if(!arr.length)return '<div class="card empty">이 달에 등록된 일정이 없습니다.</div>';return `<div class="personal-list">${arr.map(date=>{const items=events.filter(e=>e.date===date),a=getAvailability(personId,date),st=a?.status==='unavailable'?'unavailable':a?.status==='pending'?'pending':'available';return `<button type="button" class="personal-list-day" onclick="openPersonalDateDetail('${personId}','${date}')"><div class="row"><div class="personal-list-date">${dateLabel(date)}</div><span class="badge ${st==='available'?'available':st}">${availabilityLabel(st)}</span></div>${items.length?items.map(e=>{const c=personalEventCategory(personId,e);return `<div class="personal-list-event"><span class="personal-category ${c.key}">${c.icon} ${c.label}</span><b>${esc(eventTitle(e))}</b>${e.startTime?` · ${esc(e.startTime)}`:''}${e.venue?` · ${esc(e.venue)}`:''}</div>`}).join(''):'<div class="small muted">공연 일정 없음 · 개인 일정만 등록됨</div>'}</button>`}).join('')}</div>`}
function availabilityPage(){const p=personById(session.personId);if(!p?.roles?.includes('actor'))return `<div class="section-title"><h2>개인 일정</h2></div><div class="card empty">배우 계정에서 이용할 수 있습니다.</div>`;const assignments=actorWorkAssignments(p.id),allowed=new Set(assignments.map(x=>x.workId));if(session.personalWorkFilter!=='all'&&!allowed.has(session.personalWorkFilter))session.personalWorkFilter='all';session.personalWorkFilter=session.personalWorkFilter||'all';session.availabilityView=session.availabilityView||'calendar';const month=session.availabilityMonth;return `<div class="section-title"><h2>개인 일정</h2></div><div class="card compact"><b>${esc(p.name)}</b><div class="small muted">참여 작품을 선택하면 해당 작품의 공연 일정만 볼 수 있습니다.</div><div class="hr-label">참여 작품</div><div class="personal-work-filter"><button class="${session.personalWorkFilter==='all'?'on':''}" onclick="setPersonalWorkFilter('all')">전체</button>${assignments.map(a=>`<button class="${session.personalWorkFilter===a.workId?'on':''}" onclick="setPersonalWorkFilter('${a.workId}')">${esc(a.title)}</button>`).join('')}</div></div><div class="card"><div class="calendar-head"><button class="btn" onclick="moveAvailabilityMonth(-1)">◀</button><b>${month.replace('-','년 ')}월</b><button class="btn" onclick="moveAvailabilityMonth(1)">▶</button></div><div class="personal-view-switch"><button class="${session.availabilityView==='calendar'?'on':''}" onclick="setAvailabilityView('calendar')">달력으로 보기</button><button class="${session.availabilityView==='list'?'on':''}" onclick="setAvailabilityView('list')">목록으로 보기</button></div><div class="actions" style="margin-bottom:10px"><button class="btn ${session.availabilityMultiMode?'primary':'ghost'} smallbtn" type="button" onclick="toggleAvailabilityMultiMode()">${session.availabilityMultiMode?'✓ 여러 날짜 선택 중':'여러 날짜 일괄등록'}</button></div>${session.availabilityView==='list'?renderPersonalList(p.id,month):renderPersonalCalendar(p.id,month)}${session.availabilityMultiMode?renderScheduleEdit function renderPersonalUpcoming(personId){const today=localDateKey(),tomorrow=addDaysKey(today,1),dates=[today,tomorrow],events=data.events.filter(e=>e.status==='confirmed'&&dates.includes(e.date)&&assignedActorIds(e).includes(personId)).sort((a,b)=>(a.date+(a.startTime||'')).localeCompare(b.date+(b.startTime||'')));return `<div class="hr-label">다가오는 일정</div><div class="upcoming-personal">${dates.map((date,idx)=>{const items=events.filter(e=>e.date===date);return `<div class="upcoming-personal-card"><div class="day-label">${idx===0?'오늘':'내일'} · ${dateLabel(date)}</div>${items.length?items.map(e=>`<div style="padding:5px 0"><div class="title">🎭 ${esc(eventTitle(e))}</div><div class="meta">${esc(eventTimeText(e))}${e.venue?` · 📍 ${esc(e.venue)}`:''} · ${eventConfirmedByPerson(e,personId)?'✓ 확인완료':'알림에서 확인 필요'}</div></div>`).join(''):'<div class="small muted">예정된 확정 공연이 없습니다.</div>'}</div>`}).join('')}</div>`}
function renderMonthlyPerformanceConfirmList(personId,month,context='page'){return context==='actor'?'':renderPersonalUpcoming(personId)}

function eventScheduleDraft(personId,e){const old=data.eventAvailability?.[personId]?.[e.id]||getAvailability(personId,e.date);return {status:old?.status==='unavailable'?'unavailable':old?.status==='pending'?'pending':'available',late:!!old?.late,early:!!old?.early,lodging:!!old?.lodging,ride:!!old?.ride,vehicleReg:!!old?.vehicleReg,memo:old?.memo||''}}
function upsertEventAvailabilityAlert(personId,e,before,after){const key=`eventavailability:${personId}:${e.id}`,p=personById(personId);if(!p)return;if(e.status!=='confirmed'||!assignedActorIds(e).includes(personId)){removeAlertByKey(key);return}const beforeSig=availabilitySignature(before),afterSig=availabilitySignature(after);let a=data.alerts.find(x=>alertKeyFor(x)===key);if(!a){if(beforeSig===afterSig)return;a={id:uid('alert'),scope:'manager',alertKey:key,type:'event-availability-change',eventId:e.id,workId:e.workId,personId,date:e.date,baselineSignature:beforeSig,baselineText:before?availabilitySummary(before):'가능(기본)',createdAt:new Date().toISOString(),read:false};data.alerts.unshift(a)}const base=a.baselineSignature||beforeSig;if(afterSig===base){removeAlertByKey(key);return}const current=after?availabilitySummary(after):'가능(기본)';Object.assign(a,{createdAt:new Date().toISOString(),read:false,text:`${p.name} 공연별 일정 변경: ${dateLabel(e.date)} · ${eventTitle(e)} · ${a.baselineText} → ${current}${after?.status==='unavailable'?' · ⚠ 배역 미확정':''}`})}
function applyEventScheduleRecord(personId,e,next){const base=getAvailability(personId,e.date),before=data.eventAvailability?.[personId]?.[e.id]||base||null,clean={...next,status:next.status==='unavailable'?'unavailable':next.status==='pending'?'pending':'available',updatedAt:new Date().toISOString()};data.eventAvailability[personId]=data.eventAvailability[personId]||{};if(availabilitySignature(clean)===availabilitySignature(base))delete data.eventAvailability[personId][e.id];else data.eventAvailability[personId][e.id]=clean;const after=data.eventAvailability[personId][e.id]||base||null;upsertEventAvailabilityAlert(personId,e,before,after)}
function clearEventAvailabilityForDate(personId,events){data.eventAvailability[personId]=data.eventAvailability[personId]||{};events.forEach(e=>{delete data.eventAvailability[personId][e.id];removeAlertByKey(`eventavailability:${personId}:${e.id}`)})}
function setPersonalDateMode(personId,date,mode){session.personalDateModes=session.personalDateModes||{};session.personalDateModes[date]=mode==='per'?'per':'all';refreshPersonalDateModal(personId,date)}
function refreshPersonalDateModal(personId,date){const old=[...document.querySelectorAll('.modal-bg')].find(x=>x.dataset.personalDate===`${personId}:${date}`),top=old?.querySelector('.modal')?.scrollTop||0;if(old)old.remove();const next=openPersonalDateDetail(personId,date);requestAnimationFrame(()=>{const m=next?.querySelector('.modal');if(m)m.scrollTop=top})}
function openPersonalDateDetail(personId,date){const p=personById(personId);if(!p)return null;const ids=new Set(personalWorkIds(personId)),filter=session.personalWorkFilter||'all',events=data.events.filter(e=>e.date===date&&ids.has(e.workId)&&(filter==='all'||e.workId===filter)).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));session.personalDateModes=session.personalDateModes||{};const mode=session.personalDateModes[date]||'all';const info=events.length?events.map(e=>{const c=personalEventCategory(personId,e);return `<div class="personal-date-event"><div class="row start"><div class="grow"><span class="personal-category ${c.key}">${c.icon} ${c.label}</span><div class="title">${esc(eventTitle(e))}</div><div class="meta">${esc(eventTimeText(e))}${e.venue?` · 📍 ${esc(e.venue)}`:''}${e.company?` · 🏢 ${esc(e.company)}`:''}</div></div></div></div>`}).join(''):'<div class="card empty">이 날짜에 선택된 작품의 공연 일정이 없습니다.</div>';let editor='';if(!events.length){const prefix=`pdDate_${personId}_${date.replaceAll('-','_')}`;editor=renderScheduleControl(prefix,scheduleDraftForDate(personId,date),'이 날짜의 개인 일정')+`<button class="btn primary full" id="pdSaveDate">저장</button>`}else if(events.length===1){const e=events[0],prefix=`pdEvent_${e.id}`;editor=renderScheduleControl(prefix,eventScheduleDraft(personId,e),`${eventTitle(e)} 일정`)+`<button class="btn primary full" id="pdSaveEvent">이 공연 일정 저장</button>`}else{editor=`<div class="personal-date-mode"><button class="${mode==='all'?'on':''}" onclick="setPersonalDateMode('${personId}','${date}','all')">전체 일정에 동일 적용</button><button class="${mode==='per'?'on':''}" onclick="setPersonalDateMode('${personId}','${date}','per')">각 일정에 적용</button></div>`;if(mode==='all'){const prefix=`pdAll_${personId}_${date.replaceAll('-','_')}`;editor+=renderScheduleControl(prefix,scheduleDraftForDate(personId,date),`${events.length}개 공연에 동일 적용`)+`<button class="btn primary full" id="pdSaveAll">전체 일정에 저장</button>`}else editor+=events.map(e=>{const prefix=`pdEvent_${e.id}`;return renderScheduleControl(prefix,eventScheduleDraft(personId,e),eventTitle(e))}).join('')+`<button class="btn primary full" id="pdSavePer">각 일정 저장</button>`}const bg=modalShell(`<h3>${dateLabel(date)} 일정</h3>${info}<div class="hr-label">가능 여부 등록</div>${editor}<div class="modal-sticky"><div class="actions"><button class="btn ghost" data-close>닫기</button></div></div>`);bg.dataset.personalDate=`${personId}:${date}`;const finish=()=>{persist();bg.remove();renderPage()};bg.querySelector('#pdSaveDate')?.addEventListener('click',()=>{const prefix=`pdDate_${personId}_${date.replaceAll('-','_')}`;applyScheduleRecord(personId,date,readScheduleBlock(prefix));finish()});bg.querySelector('#pdSaveEvent')?.addEventListener('click',()=>{const e=events[0];applyEventScheduleRecord(personId,e,readScheduleBlock(`pdEvent_${e.id}`));finish()});bg.querySelector('#pdSaveAll')?.addEventListener('click',()=>{const prefix=`pdAll_${personId}_${date.replaceAll('-','_')}`;clearEventAvailabilityForDate(personId,events);applyScheduleRecord(personId,date,readScheduleBlock(prefix));finish()});bg.querySelector('#pdSavePer')?.addEventListener('click',()=>{events.forEach(e=>applyEventScheduleRecord(personId,e,readScheduleBlock(`pdEvent_${e.id}`)));finish()});return bg}

function accessibleNoticeWorks(){if(canManage())return data.works.slice().sort((a,b)=>a.title.localeCompare(b.title));const p=personById(session.personId),roles=p?.roles||[];if(roles.includes('staff'))return data.works.filter(w=>w.active!==false).sort((a,b)=>a.title.localeCompare(b.title));const ids=new Set(personalWorkIds(session.personId));return data.works.filter(w=>ids.has(w.id)).sort((a,b)=>a.title.localeCompare(b.title))}

function renderEventCalendar(month){
  const base=parseMonth(month),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
  let h='<div class="calendar-week">'+['일','월','화','수','목','금','토'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="calendar-grid event-calendar">';
  for(let i=0;i<first.getDay();i++)h+='<div class="cal-day empty"></div>';
  for(let d=1;d<=last.getDate();d++){
    const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
      all=data.events.filter(e=>e.date===date).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')),
      items=all.filter(eventMatchesCalendarFilters),
      clickable=items.length||(!calendarFiltersActive()&&canManage()&&!all.length);
    h+=`<div class="cal-day" ${clickable?`role="button" tabindex="0" onclick="openDateDetail('${date}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDateDetail('${date}')}"`:''}><div class="cal-num">${d}</div>${items.slice(0,5).map(e=>compactCalendarEventHtml(e,true)).join('')}${items.length>5?`<div class="tiny muted">+${items.length-5}건</div>`:''}</div>`;
  }
  return h+'</div>';
}

/* Personal date detail gains context so actor-detail uses the same multi-event editor. */
function setPersonalDateMode(personId,date,mode,context='page'){
  session.personalDateModes=session.personalDateModes||{};
  session.personalDateModes[date]=mode==='per'?'per':'all';
  refreshPersonalDateModal(personId,date,context);
}
function refreshPersonalDateModal(personId,date,context='page'){
  const old=[...document.querySelectorAll('.modal-bg')].find(x=>x.dataset.personalDate===`${personId}:${date}`),
    top=old?.querySelector('.modal')?.scrollTop||0;
  if(old)old.remove();
  const next=openPersonalDateDetail(personId,date,context);
  requestAnimationFrame(()=>{const m=next?.querySelector('.modal');if(m)m.scrollTop=top});
}
function openPersonalDateDetail(personId,date,context='page'){
  const p=personById(personId);if(!p)return null;
  const ids=new Set(personalWorkIds(personId)),filter=context==='actor'?'all':(session.personalWorkFilter||'all'),
    events=data.events.filter(e=>e.date===date&&ids.has(e.workId)&&(filter==='all'||e.workId===filter)).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
  session.personalDateModes=session.personalDateModes||{};
  const mode=session.personalDateModes[date]||'all';
  const info=events.length?events.map(e=>{const c=personalEventCategory(personId,e),st=getStaffingInfo(e);return `<div class="personal-date-event"><div class="row start"><div class="grow"><span class="personal-category ${c.key}">${c.icon} ${c.label}</span><div class="title">${esc(eventNickname(e))} <span class="muted">· ${esc(eventTitle(e))}</span></div><div class="meta">${esc(eventTimeText(e))}${e.status!=='confirmed'?' · 공연 미확정':''}${e.status==='confirmed'&&st.state!=='complete'?` · ${esc(st.label)}`:''}${e.venue?` · 📍 ${esc(e.venue)}`:''}</div></div></div></div>`}).join(''):'<div class="card empty">이 날짜에 참여 작품의 공연 일정이 없습니다.</div>';
  let editor='';
  if(!events.length){
    const prefix=`pdDate_${personId}_${date.replaceAll('-','_')}`;
    editor=renderScheduleControl(prefix,scheduleDraftForDate(personId,date),'이 날짜의 개인 일정')+`<button class="btn primary full" id="pdSaveDate">저장</button>`;
  }else if(events.length===1){
    const e=events[0],prefix=`pdEvent_${e.id}`;
    editor=renderScheduleControl(prefix,eventScheduleDraft(personId,e),`${eventNickname(e)} 일정`)+`<button class="btn primary full" id="pdSaveEvent">이 공연 일정 저장</button>`;
  }else{
    editor=`<div class="personal-date-mode"><button class="${mode==='all'?'on':''}" onclick="setPersonalDateMode('${personId}','${date}','all','${context}')">전체 일정에 동일 적용</button><button class="${mode==='per'?'on':''}" onclick="setPersonalDateMode('${personId}','${date}','per','${context}')">각 일정에 적용</button></div>`;
    if(mode==='all'){
      const prefix=`pdAll_${personId}_${date.replaceAll('-','_')}`;
      editor+=renderScheduleControl(prefix,scheduleDraftForDate(personId,date),`${events.length}개 공연에 동일 적용`)+`<button class="btn primary full" id="pdSaveAll">전체 일정에 저장</button>`;
    }else{
      editor+=events.map(e=>{const prefix=`pdEvent_${e.id}`;return renderScheduleControl(prefix,eventScheduleDraft(personId,e),eventNickname(e))}).join('')+`<button class="btn primary full" id="pdSavePer">각 일정 저장</button>`;
    }
  }
  const bg=modalShell(`<h3>${dateLabel(date)} 일정</h3>${info}<div class="hr-label">가능 여부 등록</div>${editor}<div class="modal-sticky"><div class="actions"><button class="btn ghost" data-close>닫기</button></div></div>`);
  bg.dataset.personalDate=`${personId}:${date}`;
  const finish=()=>{persist();bg.remove();if(context==='actor')refreshActorDetailIfOpen(personId);else renderPage()};
  bg.querySelector('#pdSaveDate')?.addEventListener('click',()=>{const prefix=`pdDate_${personId}_${date.replaceAll('-','_')}`;applyScheduleRecord(personId,date,readScheduleBlock(prefix));finish()});
  bg.querySelector('#pdSaveEvent')?.addEventListener('click',()=>{const e=events[0];applyEventScheduleRecord(personId,e,readScheduleBlock(`pdEvent_${e.id}`));finish()});
  bg.querySelector('#pdSaveAll')?.addEventListener('click',()=>{const prefix=`pdAll_${personId}_${date.replaceAll('-','_')}`;clearEventAvailabilityForDate(personId,events);applyScheduleRecord(personId,date,readScheduleBlock(prefix));finish()});
  bg.querySelector('#pdSavePer')?.addEventListener('click',()=>{events.forEach(e=>applyEventScheduleRecord(personId,e,readScheduleBlock(`pdEvent_${e.id}`)));finish()});
  return bg;
}

function openEventDetail(id){

/* ===== V13 임시 캐스팅 배우 ===== */
function temporaryActorsForGroup(e,groupId){
  const arr=e?.tempActors?.[groupId];
  return Array.isArray(arr)?arr.filter(x=>x&&String(x.name||'').trim()):[];
}
function addTemporaryCastActor(draft,groupId){
  const name=prompt('임시 캐스팅 배우 이름을 입력해주세요.');
  if(name===null)return false;
  const clean=String(name||'').trim();
  if(!clean){alert('배우 이름을 입력해주세요.');return false}
  draft.tempActors=draft.tempActors&&typeof draft.tempActors==='object'?draft.tempActors:{};
  draft.tempActors[groupId]=Array.isArray(draft.tempActors[groupId])?draft.tempActors[groupId]:[];
  if(draft.tempActors[groupId].some(x=>String(x?.name||'').trim()===clean)){
    alert('이 배역에 같은 이름의 임시 캐스팅 배우가 이미 추가되어 있습니다.');
    return false;
  }
  draft.tempActors[groupId].push({id:uid('tempactor'),name:clean});
  return true;
}
function removeTemporaryCastActor(draft,groupId,tempId){
  draft.tempActors=draft.tempActors&&typeof draft.tempActors==='object'?draft.tempActors:{};
  draft.tempActors[groupId]=(draft.tempActors[groupId]||[]).filter(x=>x?.id!==tempId);
  if(!draft.tempActors[groupId].length)delete draft.tempActors[groupId];
}
function getStaffingInfo(e){
  const w=workById(e.workId);
  if(!w)return {state:'unknown',label:'캐스팅 미설정',missing:0,conflicts:0,pending:0};
  const groups=(w.castGroups||[]).filter(g=>g.kind==='actor');
  if(!groups.length)return {state:'incomplete',label:'배역 미확정',missing:1,conflicts:0,pending:0};
  let missing=0,conflicts=0,pending=0;
  groups.forEach(g=>{
    const ids=(e.assignments?.[g.id]||[]).filter(id=>(g.candidateIds||[]).includes(id));
    const temps=temporaryActorsForGroup(e,g.id);
    if(!ids.length&&!temps.length)missing++;
    ids.forEach(id=>{
      const st=getAvailabilityForEvent(id,e)?.status||'available';
      if(st==='unavailable')conflicts++;
      if(st==='pending')pending++;
    });
  });
  if(missing||conflicts){
    const issue=missing+conflicts;
    return {state:'incomplete',label:`배역 미확정${issue?` ${issue}`:''}`,missing,conflicts,pending};
  }
  return {state:'complete',label:'인원 확정',missing:0,conflicts:0,pending};
}
function compactCastingRows(e){
  const w=workById(e.workId),groups=(w?.castGroups||[]).filter(g=>g.kind==='actor'&&(w?.roleNames||[]).includes(g.label)),rows=[];
  groups.forEach(g=>{
    const ids=(e.assignments?.[g.id]||[]).filter(id=>(g.candidateIds||[]).includes(id));
    const temps=temporaryActorsForGroup(e,g.id);
    if(!ids.length&&!temps.length){
      rows.push(`<div class="cast-compact-row"><span class="role">🎭 ${esc(g.label)}</span><span class="actor">👤 미배정</span><span class="schedule unavailable">⛔ 배역 미확정</span><span class="confirm wait">🔔 -</span></div>`);
    }
    ids.forEach(pid=>{
      const p=personById(pid),st=getAvailabilityForEvent(pid,e)?.status||'available',ack=eventConfirmedByPerson(e,pid);
      rows.push(`<div class="cast-compact-row"><span class="role">🎭 ${esc(g.label)}</span><span class="actor">👤 ${esc(p?.name||'삭제된 배우')}</span><span class="schedule ${st}">${st==='unavailable'?'⛔':st==='pending'?'❔':'🟢'} 일정 ${availabilityLabel(st)}</span><span class="confirm ${ack?'ok':'wait'}">${ack?'✅':'🔔'} ${ack?'확인':'미확인'}</span></div>`);
    });
    temps.forEach(t=>{
      rows.push(`<div class="cast-compact-row"><span class="role">🎭 ${esc(g.label)}</span><span class="actor">👤 ${esc(t.name)}</span><span class="schedule available">임시 캐스팅</span><span class="confirm wait">외부 인원</span></div>`);

  return rows.length?`<div class="cast-compact-list">${rows.join('')}</div>`:'<div class="small muted">배정된 배우가 없습니다.</div>';
}
function drawEventStaffing(bg,draft){

  area.innerHTML=actorHtml+staffHtml;
  area.querySelectorAll('[data-group][data-person]').forEach(ch=>ch.onchange=()=>{

/* ===== V14 calendar modes / casting fairness / residence ===== */
function calendarViewMode(){return session.calendarView==='list'?'list':'calendar'}
function setCalendarView(mode){session.calendarView=mode==='list'?'list':'calendar';renderPage()}
function castingFilterWorkId(){return session.calendarCastingWorkId||'all'}
function setCastingFilterWork(id){session.calendarCastingWorkId=id||'all';renderPage()}

function eventMatchesCalendarFilters(e){
  if(!calendarFiltersActive())return true;
  const castingOn=calendarFilterOn('casting'),unconfirmedOn=calendarFilterOn('unconfirmed');
  if(castingOn&&castingFilterWorkId()!=='all'&&e.workId!==castingFilterWorkId())return false;
  const matches=[];
  if(unconfirmedOn)matches.push(e.status==='inquiry');
  if(castingOn)matches.push(e.status==='confirmed'&&getStaffingInfo(e).state!=='complete');
  return matches.some(Boolean);
}

function sameDateConfirmedConflict(personId,e){
  if(!personId||!e?.date)return null;
  return data.events
    .filter(x=>x.status==='confirmed'&&x.date===e.date&&x.id!==e.id&&assignedActorIds(x).includes(personId))
    .sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''))[0]||null;
}
function castingAvailabilityInfo(personId,e){
  const conflict=sameDateConfirmedConflict(personId,e);
  if(conflict){
    return {status:'unavailable',text:`불가능(${eventNickname(conflict)||eventTitle(conflict)} 공연 참여)`,conflict};
  }
  const a=data.eventAvailability?.[personId]?.[e?.id]||getAvailability(personId,e?.date||'');
  const status=a?.status==='unavailable'?'unavailable':a?.status==='pending'?'pending':'available';
  return {status,text:a?availabilitySummary(a):'가능(기본)',conflict:null};
}
function getAvailabilityForEvent(personId,e){
  const info=castingAvailabilityInfo(personId,e);
  if(info.conflict)return {status:'unavailable',memo:`${eventNickname(info.conflict)||eventTitle(info.conflict)} 공연 참여`,scheduleConflict:true,conflictEventId:info.conflict.id};
  return data.eventAvailability?.[personId]?.[e?.id]||getAvailability(personId,e?.date||'');
}
function workYearFrequency(personId,draft){
  const year=(draft?.date||localDateKey()).slice(0,4),workId=draft?.workId||'';
  const confirmed=data.events.filter(e=>e.status==='confirmed'&&e.workId===workId&&String(e.date||'').startsWith(year)&&e.id!==draft?.id);
  let total=confirmed.length;
  let mine=confirmed.filter(e=>assignedActorIds(e).includes(personId)).length;
  if(draft?.status==='confirmed'&&draft?.date?.startsWith(year)&&workId){
    total+=1;
    const currentlySelected=Object.values(draft.assignments||{}).some(ids=>(ids||[]).includes(personId));
    if(currentlySelected)mine+=1;
  }
  return {mine,total,year};
}
function getStaffingInfo(e){
  const w=workById(e.workId);
  if(!w)return {state:'unknown',label:'캐스팅 미설정',missing:0,conflicts:0,pending:0};
  const groups=(w.castGroups||[]).filter(g=>g.kind==='actor');
  if(!groups.length)return {state:'incomplete',label:'배역 미확정',missing:1,conflicts:0,pending:0};
  let missing=0,conflicts=0,pending=0;
  groups.forEach(g=>{
    const ids=(e.assignments?.[g.id]||[]).filter(id=>(g.candidateIds||[]).includes(id));
    const temps=temporaryActorsForGroup(e,g.id);
    if(!ids.length&&!temps.length)missing++;
    ids.forEach(id=>{
      const st=castingAvailabilityInfo(id,e).status;
      if(st==='unavailable')conflicts++;
      if(st==='pending')pending++;
    });
  });
  if(missing||conflicts){
    const issue=missing+conflicts;
    return {state:'incomplete',label:`배역 미확정${issue?` ${issue}`:''}`,missing,conflicts,pending};
  }
  return {state:'complete',label:'인원 확정',missing:0,conflicts:0,pending};
}

function renderCalendarList(month){
  const items=data.events

    const registeredHtml=g.candidateIds.length?`<div class="casting-candidate-grid">${g.candidateIds.map(pid=>{
      const p=personById(pid);if(!p)return '';
      const checked=chosen.includes(pid),info=draft.date?castingAvailabilityInfo(pid,draft):{status:'available',text:'날짜를 선택하면 일정 상태가 표시됩니다.',conflict:null},
        freq=workYearFrequency(pid,draft),disabled=!!(info.conflict&&!checked);
      return `<label class="casting-candidate ${checked?'checked':''} ${info.conflict?'conflict':''}"><input type="checkbox" data-group="${g.id}" data-person="${pid}" ${checked?'checked':''} ${disabled?'disabled':''}><div class="casting-candidate-main"><div class="casting-candidate-name">${esc(p.name)}</div><div class="casting-candidate-region">📍 ${esc(p.region||'주거지역 미입력')}</div><div class="casting-candidate-frequency">올해 확정 ${freq.mine}/${freq.total}</div><div class="casting-candidate-status ${info.status}">${esc(info.text)}</div></div></label>`;
    }).join('')}</div>`:'<div class="small muted" style="padding:5px 0">이 배역에 연결된 정식 등록 배우가 없습니다.</div>';
    const tempHtml=temps.length?`<div class="temp-cast-list">${temps.map(t=>`<div class="temp-cast-row"><div class="grow"><div class="temp-name">👤 ${esc(t.name)}</div><div class="temp-note">이 공연에만 적용되는 임시 캐스팅 배우 · 자동 선택됨</div></div><button class="btn danger smallbtn" type="button" data-temp-remove="${g.id}:${t.id}">삭제</button></div>`).join('')}</div>`:'';
    return `<div class="staff-group ${totalChosen?'ok':'missing'}"><div class="staff-title"><b>🎭 ${esc(g.label)}</b><span class="badge ${totalChosen?'complete':'incomplete'}">${totalChosen?`선택 ${totalChosen}명`:'미선택'}</span></div>${registeredHtml}${tempHtml}<button class="btn smallbtn temp-cast-add" type="button" data-temp-add="${g.id}">+ 임시 캐스팅 배우 추가</button></div>`;
  }).join(''):'<div class="empty">이 작품에는 아직 배역이 등록되지 않았습니다. 작품 수정에서 배역과 배우를 등록해주세요.</div>';
  const staff=staffPeople();
  const staffHtml=`<div class="hr-label">스탭</div><div class="staff-picker"><div class="small muted" style="margin-bottom:7px">관리 페이지에서 ‘스탭’으로 등록된 인원입니다.</div>${staff.length?staff.map(p=>`<label class="assign-candidate"><input type="checkbox" data-event-staff="${p.id}" ${draft.staffIds.includes(p.id)?'checked':''}><div class="candidate-main"><b>${esc(p.name)}</b><div class="small muted">스탭</div></div></label>`).join(''):'<div class="empty">등록된 스탭이 없습니다.</div>'}</div>`;
  area.innerHTML=actorHtml+staffHtml;
  area.querySelectorAll('[data-group][data-person]').forEach(ch=>ch.onchange=()=>{
    const gid=ch.dataset.group,pid=ch.dataset.person;
    draft.assignments[gid]=draft.assignments[gid]||[];
    if(ch.checked&&!draft.assignments[gid].includes(pid))draft.assignments[gid].push(pid);
    if(!ch.checked)draft.assignments[gid]=draft.assignments[gid].filter(x=>x!==pid);
    drawEventStaffing(bg,draft);
  });
  area.querySelectorAll('[data-temp-add]').forEach(btn=>btn.onclick=()=>{if(addTemporaryCastActor(draft,btn.dataset.tempAdd))drawEventStaffing(bg,draft)});
  area.querySelectorAll('[data-temp-remove]').forEach(btn=>btn.onclick=()=>{
    const raw=btn.dataset.tempRemove||'',idx=raw.indexOf(':'),gid=raw.slice(0,idx),tempId=raw.slice(idx+1);
    removeTemporaryCastActor(draft,gid,tempId);drawEventStaffing(bg,draft);
  });
  area.querySelectorAll('[data-event-staff]').forEach(ch=>ch.onchange=()=>{
    const pid=ch.dataset.eventStaff;
    if(ch.checked&&!draft.staffIds.includes(pid))draft.staffIds.push(pid);
    if(!ch.checked)draft.staffIds=draft.staffIds.filter(x=>x!==pid);
  });
}


/* ===== V15 개인일정: 본인과 같은 배역 기준 캐스팅 상태 ===== */
function personalRoleGroups(personId,e){
  const w=workById(e?.workId);
  if(!w)return [];
  const p=personById(personId);
  return (w.castGroups||[]).filter(g=>{
    if(g.kind!=='actor')return false;
    if((g.candidateIds||[]).includes(personId))return true;
    return !!(p?.name&&(g.candidateNames||[]).some(n=>String(n).trim()===String(p.name).trim()));
  });
}
function personalRoleCastingState(personId,e){
  const groups=personalRoleGroups(personId,e);
  if(!groups.length)return {state:'none',groups:[]};

  let mine=false,missing=false,otherComplete=true;
  groups.forEach(g=>{
    const assigned=(e.assignments?.[g.id]||[]).filter(Boolean);
    const temps=temporaryActorsForGroup(e,g.id);
    if(assigned.includes(personId))mine=true;

    const hasAny=assigned.length>0||temps.length>0;
    if(!hasAny){
      missing=true;
      otherComplete=false;
    }
  });

  if(mine)return {state:'mine',groups};
  if(missing)return {state:'casting',groups};
  if(otherComplete)return {state:'other',groups};
  return {state:'casting',groups};
}
function personalEventCategory(personId,e){
  if(e.status!=='confirmed')return {key:'inquiry',label:'공연 미확정',icon:'❔'};
  const roleState=personalRoleCastingState(personId,e);
  if(roleState.state==='mine')return {key:'mine',label:'내 확정 공연',icon:'⭐'};
  if(roleState.state==='casting')return {key:'casting',label:'캐스팅 미확정',icon:'⚠'};
  if(roleState.state==='other')return {key:'other',label:'다른 배우 확정',icon:'👥'};
  return {key:'other',label:'다른 배우 확정',icon:'👥'};
}

/* 개인일정 날짜 팝업도 전체 작품의 다른 배역 상태가 아니라,
   본인과 같은 배역의 상태만 표시한다. */
function openPersonalDateDetail(personId,date,context='page'){
  const p=personById(personId);if(!p)return null;
  const ids=new Set(personalWorkIds(personId)),filter=context==='actor'?'all':(session.personalWorkFilter||'all'),
    events=data.events.filter(e=>e.date===date&&ids.has(e.workId)&&(filter==='all'||e.workId===filter)).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
  session.personalDateModes=session.personalDateModes||{};
  const mode=session.personalDateModes[date]||'all';
  const info=events.length?events.map(e=>{
    const c=personalEventCategory(personId,e);
    return `<div class="personal-date-event"><div class="row start"><div class="grow"><span class="personal-category ${c.key}">${c.icon} ${c.label}</span><div class="title">${esc(eventNickname(e))} <span class="muted">· ${esc(eventTitle(e))}</span></div><div class="meta">${esc(eventTimeText(e))}${e.status!=='confirmed'?' · 공연 미확정':c.key==='casting'?' · 본인 배역 캐스팅 미확정':c.key==='other'?' · 본인 배역 다른 배우 확정':c.key==='mine'?' · 본인 캐스팅 확정':''}${e.venue?` · 📍 ${esc(e.venue)}`:''}</div></div></div></div>`;
  }).join(''):'<div class="card empty">이 날짜에 참여 작품의 공연 일정이 없습니다.</div>';
  let editor='';
  if(!events.length){
    const prefix=`pdDate_${personId}_${date.replaceAll('-','_')}`;
    editor=renderScheduleControl(prefix,scheduleDraftForDate(personId,date),'이 날짜의 개인 일정')+`<button class="btn primary full" id="pdSaveDate">저장</button>`;
  }else if(events.length===1){
    const e=events[0],prefix=`pdEvent_${e.id}`;
    editor=renderScheduleControl(prefix,eventScheduleDraft(personId,e),`${eventNickname(e)} 일정`)+`<button class="btn primary full" id="pdSaveEvent">이 공연 일정 저장</button>`;
  }else{
    editor=`<div class="personal-date-mode"><button class="${mode==='all'?'on':''}" onclick="setPersonalDateMode('${personId}','${date}','all','${context}')">전체 일정에 동일 적용</button><button class="${mode==='per'?'on':''}" onclick="setPersonalDateMode('${personId}','${date}','per','${context}')">각 일정에 적용</button></div>`;
    if(mode==='all'){
      const prefix=`pdAll_${personId}_${date.replaceAll('-','_')}`;
      editor+=renderScheduleControl(prefix,scheduleDraftForDate(personId,date),`${events.length}개 공연에 동일 적용`)+`<button class="btn primary full" id="pdSaveAll">전체 일정에 저장</button>`;
    }else{
      editor+=events.map(e=>{const prefix=`pdEvent_${e.id}`;return renderScheduleControl(prefix,eventScheduleDraft(personId,e),eventNickname(e))}).join('')+`<button class="btn primary full" id="pdSavePer">각 일정 저장</button>`;
    }
  }
  const bg=modalShell(`<h3>${dateLabel(date)} 일정</h3>${info}<div class="hr-label">가능 여부 등록</div>${editor}<div class="modal-sticky"><div class="actions"><button class="btn ghost" data-close>닫기</button></div></div>`);
  bg.dataset.personalDate=`${personId}:${date}`;
  const finish=()=>{persist();bg.remove();if(context==='actor')refreshActorDetailIfOpen(personId);else renderPage()};
  bg.querySelector('#pdSaveDate')?.addEventListener('click',()=>{const prefix=`pdDate_${personId}_${date.replaceAll('-','_')}`;applyScheduleRecord(personId,date,readScheduleBlock(prefix));finish()});
  bg.querySelector('#pdSaveEvent')?.addEventListener('click',()=>{const e=events[0];applyEventScheduleRecord(personId,e,readScheduleBlock(`pdEvent_${e.id}`));finish()});
  bg.querySelector('#pdSaveAll')?.addEventListener('click',()=>{const prefix=`pdAll_${personId}_${date.replaceAll('-','_')}`;clearEventAvailabilityForDate(personId,events);applyScheduleRecord(personId,date,readScheduleBlock(prefix));finish()});
  bg.querySelector('#pdSavePer')?.addEventListener('click',()=>{events.forEach(e=>applyEventScheduleRecord(personId,e,readScheduleBlock(`pdEvent_${e.id}`)));finish()});
  return bg;
}
